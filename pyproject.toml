[project]
name = "deep-agents-on-foundry"
version = "0.1.0"
description = "Research Deep Agent on Microsoft Foundry"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-agentserver-responses>=2.1.0",
    "azure-ai-evaluation>=1.18.5",
    "azure-ai-projects>=2.6.0",
    "azure-identity>=1.25.3",
    "deepagents>=0.7.11",
    "langchain-azure-ai[opentelemetry]>=1.2.9",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "aiosqlite>=0.20.0",
    "matplotlib>=3.11.1",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deep_agents_foundry"]

[[tool.uv.index]]
url = "https://packagefeedproxy.microsoft.io/pypi/simple"
default = true

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
