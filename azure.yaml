# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: deep-agents-on-foundry
services:
    deep-agents-foundry:
        host: azure.ai.project
        endpoint: https://deep-agents-foundry-resource.services.ai.azure.com/api/projects/deep-agents-foundry
    deep-agents-research:
        project: .
        host: azure.ai.agent
        language: python
        uses:
            - deep-agents-foundry
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
            AZURE_AI_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
        codeConfiguration:
            dependencyResolution: remote_build
            entryPoint: main.py
            runtime: python_3_13
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        kind: hosted
        name: deep-agents-research
        protocols:
            - protocol: responses
              version: 2.0.0
infra:
    provider: microsoft.foundry
